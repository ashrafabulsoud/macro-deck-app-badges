name: Bug report
description: Something does not work the way the README says it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing App Badges. The more precise the steps, the faster it gets fixed.
  - type: input
    id: app
    attributes:
      label: Which app is the tile for?
      placeholder: Slack
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did the tile show, what did the Dock show at the same time, and what did you expect?
      placeholder: The Dock showed 5 on Slack but the tile showed no badge.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an App badge widget and pick Slack
        2. Receive a message in Slack
        3. ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown on the plugin's page in Macro Deck, or the name of the file you installed.
      placeholder: 1.0.0-beta.1
    validations:
      required: true
  - type: input
    id: macro-deck-version
    attributes:
      label: Macro Deck version
      description: The version Macro Deck reports about itself.
      placeholder: e.g. 3.0.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.1
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Where were you looking at the tile?
      multiple: true
      options:
        - Macro Deck desktop app
        - Web client (phone or tablet browser)
        - Companion app
        - Hardware deck
  - type: textarea
    id: settings
    attributes:
      label: Widget settings
      description: Icon size, badge position, style and size, and appearance settings, if you changed them.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Lines from Macro Deck's log viewer that mention App Badges or badge, if any. They are formatted automatically.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot of the tile next to the Dock helps a lot. Drag it into this box.
